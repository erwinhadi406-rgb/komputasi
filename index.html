<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Robo Komputasi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Figtree:wght@500;600;700;800&display=swap">
<style>
/* Konsep: dunia langit cerah, panel kaca, ubin pasir seperti pijakan Robo. Satu tema yang konsisten (game). */
:root{
  --ink:#12264a; --ink2:#4a6286; --sky1:#a9e0f5; --sky2:#e3f6fc; --sky3:#f1faf4;
  --orange:#ff8a1f; --orange2:#e86f00; --cyan:#27d3ff; --blue:#1796d4;
  --mint:#a5e39a; --mint2:#74c76f; --sand:#f7e8c4; --sand2:#efdcae; --sand3:#d9bd82;
  --glass:rgba(255,255,255,.8); --line:rgba(18,38,74,.14);
  --good:#1fae63; --bad:#e63e68; --yel:#ffc933;
  --w1:#ff8a1f; --w2:#1796d4; --w3:#7b6cf0; --w4:#e63e68;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 0 rgba(255,255,255,.95) inset,0 14px 34px -16px rgba(18,38,74,.45),0 2px 6px rgba(18,38,74,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{background-color:var(--sky2);background-image:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);background-attachment:fixed;color:var(--ink);font:600 16px/1.45 var(--body);min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button[disabled]{cursor:not-allowed}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
svg{display:block}
.hidden-defs{position:absolute;width:0;height:0;overflow:hidden}

/* langit */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sky i{position:absolute;height:34px;border-radius:99px;background:#fff;opacity:.75;animation:drift linear infinite}
.sky i::before,.sky i::after{content:"";position:absolute;background:#fff;border-radius:50%}
.sky i::before{width:48%;height:150%;left:14%;bottom:30%}
.sky i::after{width:34%;height:120%;right:14%;bottom:34%}
.sky i:nth-child(1){top:9%;width:130px;animation-duration:90s;left:-20%}
.sky i:nth-child(2){top:24%;width:90px;animation-duration:70s;animation-delay:-30s;left:-20%;opacity:.55}
.sky i:nth-child(3){top:58%;width:170px;animation-duration:120s;animation-delay:-60s;left:-25%;opacity:.5}
.sky i:nth-child(4){top:40%;width:110px;animation-duration:100s;animation-delay:-80s;left:-20%;opacity:.6}
@keyframes drift{to{transform:translateX(calc(100vw + 400px))}}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:22vh;min-height:110px}

#app{position:relative;z-index:1;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{max-width:1180px;margin:0 auto}
.screen[hidden]{display:none}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:16px;background:#fff;color:var(--ink);font-weight:800;box-shadow:0 3px 0 rgba(18,38,74,.16),0 8px 18px -10px rgba(18,38,74,.4);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(18,38,74,.16)}
.btn[hidden]{display:none}
.btn.primary{background:var(--orange);color:var(--ink);box-shadow:0 4px 0 var(--orange2),0 12px 22px -10px rgba(232,111,0,.7)}
.btn.navy{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0a1730}
.btn.big{min-height:56px;font-size:1.15rem;padding-inline:28px}
.btn.sm{min-height:40px;padding:6px 14px;border-radius:13px;font-size:.92rem}
.btn svg{width:20px;height:20px}
.btn[disabled]{opacity:.5;transform:none}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);border-radius:26px}

/* beranda */
.home{display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center;min-height:min(640px,calc(100vh - 80px));padding-block:10px}
.brand{display:flex;flex-direction:column;gap:18px;align-items:flex-start;min-width:0}
.kicker{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;background:#fff;font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);box-shadow:var(--shadow)}
.kicker b{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(39,211,255,.25)}
.logo{font-size:clamp(3rem,8.6vw,6.2rem);font-weight:800;letter-spacing:-.02em;line-height:.88}
.logo span{display:block;color:var(--orange);-webkit-text-stroke:0;text-shadow:0 5px 0 rgba(232,111,0,.22)}
.lead{font-size:clamp(1.02rem,2.2vw,1.25rem);color:var(--ink2);max-width:34ch;font-weight:600}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.namebox{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--glass);border:1px solid #fff;box-shadow:var(--shadow);max-width:100%}
.namebox label{font-size:.82rem;color:var(--ink2);font-weight:800;white-space:nowrap}
.namebox input{border:0;background:#fff;border-radius:12px;padding:9px 12px;font:700 1rem var(--body);color:var(--ink);min-width:0;width:170px;max-width:100%}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:520px}
.pillars div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;background:var(--glass);border:1px solid #fff;font-size:.78rem;font-weight:800;text-align:center;line-height:1.15;color:var(--ink)}
.pillars svg{width:30px;height:30px;color:var(--c)}
.stage-hero{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:260/190}
.stage-hero .plat{position:absolute;inset:0;width:100%;height:100%}
.stage-hero .hero-bot{position:absolute;left:50%;bottom:36%;width:41%;transform:translateX(-50%);animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 12px rgba(18,38,74,.25))}
.stage-hero .spark{position:absolute;width:12px;height:12px;border-radius:3px;background:var(--cyan);transform:rotate(45deg);animation:twinkle 3s ease-in-out infinite}
.stage-hero .spark:nth-of-type(2){left:12%;top:22%;background:var(--orange);animation-delay:-1s}
.stage-hero .spark:nth-of-type(3){right:10%;top:34%;animation-delay:-2s;width:9px;height:9px}
.stage-hero .spark:nth-of-type(4){right:24%;top:8%;background:#fff;animation-delay:-.5s}
@keyframes bob{50%{transform:translateX(-50%) translateY(-9px)}}
@keyframes twinkle{50%{opacity:.2;transform:rotate(45deg) scale(.6)}}

/* robot */
.robo{width:100%;height:auto;overflow:visible}
.robo .e-happy,.robo .e-sad{display:none}
.robo.happy .e-idle,.robo.sad .e-idle{display:none}
.robo.happy .e-happy{display:inline}
.robo.sad .e-sad{display:inline}
.robo .eyes{transform:translate(var(--ex,0px),var(--ey,0px));transition:transform .25s}
.robo .e-idle ellipse{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.robo .ant{animation:glow 1.8s ease-in-out infinite}
.robo .core{animation:glow 1.4s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes glow{50%{opacity:.45}}

/* peta */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar h2{font-size:clamp(1.8rem,4.6vw,2.7rem);font-weight:800}
.bar .grp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tot{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;background:#fff;font-weight:800;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.tot svg,.stars svg{width:20px;height:20px}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.world{--c:var(--w1);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;position:relative;overflow:hidden}
.world::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:var(--c)}
.world header{display:flex;align-items:center;gap:14px}
.world .wi{flex:none;width:58px;height:58px;border-radius:18px;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.world .wi svg{width:36px;height:36px}
.world h3{font-size:1.55rem;font-weight:800}
.world header p{font-size:.92rem;color:var(--ink2);line-height:1.25}
.world header>div{min-width:0;flex:1}
.world .info{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;font:800 1.1rem var(--display);box-shadow:0 2px 0 rgba(18,38,74,.14)}
.nodes{display:grid;gap:8px}
.node{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:18px;background:#fff;border:2px solid transparent;box-shadow:0 2px 0 rgba(18,38,74,.1);transition:transform .12s,border-color .12s;min-height:60px}
.node:not([disabled]):hover{transform:translateY(-2px);border-color:var(--c)}
.node .num{flex:none;width:38px;height:38px;border-radius:12px;background:var(--sand2);display:grid;place-items:center;font:800 1.2rem var(--display)}
.node.done .num{background:var(--c);color:#fff}
.node .num svg{width:18px;height:18px;color:var(--ink2)}
.node .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.node .nm b{font-family:var(--display);font-size:1.12rem;font-weight:700;line-height:1.1}
.node .nm small{color:var(--ink2);font-size:.8rem;font-weight:700}
.node[disabled]{opacity:.55;background:rgba(255,255,255,.55)}
.stars{display:flex;gap:2px;flex:none}
.stars .on{color:var(--yel)} .stars .off{color:#d4dce6}

/* peta bergambar */
.mapimg{display:none;position:relative;container-type:inline-size;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);line-height:0;background:#cfeaf5}
.mapimg img{width:100%;height:auto;display:block}
.mo{position:absolute;line-height:1.1}
.mpanel{display:flex;flex-direction:column;gap:.15cqw;padding:.45cqw .5cqw;border-radius:.9cqw;background:#fdf1da}
.mrow{flex:1;min-height:0;display:flex;align-items:center;gap:.45cqw;padding:0 .3cqw;border-radius:.6cqw;font:700 .86cqw/1.05 var(--body);color:var(--ink);text-align:left}
.mrow:not([disabled]):hover{background:#fff;outline:2px solid var(--c)}
.mrow .b{flex:none;width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:800 .95cqw var(--display)}
.mrow.done .b{background:var(--good)}
.mrow[disabled]{opacity:.75}
.mrow[disabled] .b{background:#8a93a3}
.mrow .b svg{width:.9cqw;height:.9cqw}
.mrow .t{min-width:0;flex:1}
.mrow .s{flex:none;font-size:.8cqw;color:#e8a100;letter-spacing:-.05em}
.mstars{display:flex;justify-content:space-between;align-items:center}
.mstars svg{width:2.1cqw;height:2.1cqw;color:var(--yel);filter:drop-shadow(0 .15cqw 0 rgba(0,0,0,.25))}
.mcount{display:grid;place-items:center;background:#f6fbfd;border-radius:99px;font:800 2.1cqw var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.mhit{background:transparent;border-radius:2cqw}
.mhit:hover,.mpad:hover{background:rgba(255,255,255,.28)}
.mpad{border-radius:50%;background:transparent}
@media (min-width:901px){.mapimg{display:block}.worlds{display:none}.bar h2,.bar .tot,#mapHome{display:none}.bar{margin-bottom:8px}}

/* highlight misi aktif + batas */
.maphint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:10px 14px;border-radius:18px;background:#fff;box-shadow:var(--shadow);font-weight:700;font-size:.95rem;line-height:1.3}
.maphint .go{margin-left:auto}
.maphint small{flex-basis:100%;color:var(--ink2);font-weight:700;font-size:.82rem}
.mrow{position:relative}
.mrow.open:not(.done):not(.now){background:rgba(255,255,255,.7)}
.mrow.done{background:rgba(31,174,99,.12)}
.mrow.now{background:#fff;outline:.22cqw solid var(--c);outline-offset:-.1cqw;z-index:2;animation:nowPulse 1.5s ease-in-out infinite}
.mrow.now .t{font-weight:800}
.mrow.now .go{flex:none;display:grid;place-items:center;width:1.5cqw;height:1.5cqw;border-radius:50%;background:var(--c);color:#fff;font-size:.7cqw}
.mrow.now::before{content:"MULAI DI SINI";position:absolute;right:calc(100% + .9cqw);top:50%;transform:translateY(-50%);white-space:nowrap;padding:.5cqw .8cqw;border-radius:99px;background:var(--c);color:#fff;font:800 .8cqw/1 var(--body);box-shadow:0 .25cqw 0 rgba(0,0,0,.2);animation:nowBob 1.5s ease-in-out infinite}
.mrow.now::after{content:"";position:absolute;right:calc(100% + .35cqw);top:50%;transform:translateY(-50%);border:.4cqw solid transparent;border-left:.6cqw solid var(--c);border-right:0}
.mrow.lock{background:rgba(120,130,150,.18)}
.mrow.edge{box-shadow:0 -.18cqw 0 #8a93a3 inset}
@keyframes nowPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,201,51,.9)}50%{box-shadow:0 0 0 .6cqw rgba(255,201,51,0)}}
@keyframes nowBob{50%{transform:translateY(-50%) translateX(-.3cqw)}}
.node.now{border-color:var(--c);background:#fff;animation:nodePulse 1.5s ease-in-out infinite}
.node .go{flex:none;padding:5px 12px;border-radius:99px;background:var(--c);color:#fff;font-weight:800;font-size:.8rem}
.node.lock .nm small{color:#8a93a3}
@keyframes nodePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,201,51,.9)}50%{box-shadow:0 0 0 7px rgba(255,201,51,0)}}
@media (prefers-reduced-motion:reduce){.mrow.now,.mrow.now::before,.node.now{animation:none}}

/* level */
.lv-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lv-title{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.lv-title h2{font-size:clamp(1.3rem,3.4vw,1.9rem);font-weight:800}
.chip{--c:var(--w1);align-self:flex-start;padding:3px 12px;border-radius:99px;background:var(--c);color:#fff;font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.lv-body{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(320px,.88fr);gap:18px;align-items:start}
.lv-body.single{grid-template-columns:minmax(0,760px);justify-content:center}
.col-a,.col-b{display:flex;flex-direction:column;gap:14px;min-width:0}
.bubble{display:flex;gap:12px;align-items:center;padding:12px 16px 12px 12px;border-radius:22px;background:#fff;box-shadow:var(--shadow);position:relative}
.bubble .av{flex:none;width:54px;height:62px;border-radius:16px;background:linear-gradient(#e9f9ff,#cfeefa);display:grid;place-items:end center;padding:5px 7px 0;overflow:hidden}
.bubble p{font-weight:700;font-size:1rem;min-width:0}
.boardWrap{display:flex;justify-content:center;min-width:0}
.board{--cell:64px;position:relative;padding:calc(var(--cell)*.16);border-radius:calc(var(--cell)*.46);background:linear-gradient(160deg,#9fe3f4,#6cc9e8);box-shadow:0 1px 0 #fff inset,0 18px 40px -18px rgba(18,38,74,.55),0 0 0 4px rgba(255,255,255,.7)}
.grid{display:grid;position:relative;grid-template-columns:repeat(var(--cols),var(--cell));grid-template-rows:repeat(var(--rows),var(--cell))}
.tile{position:relative;margin:calc(var(--cell)*.02);border-radius:calc(var(--cell)*.2);display:grid;place-items:center}
.tile.f1,.tile.f2{background:var(--sand);box-shadow:0 calc(var(--cell)*.07) 0 var(--sand3),inset 0 0 0 calc(var(--cell)*.03) rgba(255,255,255,.7)}
.tile.f2{background:var(--sand2)}
.tile.solid{background:var(--mint);box-shadow:0 calc(var(--cell)*.07) 0 var(--mint2)}
.tile.water{background:#5bb8f0;box-shadow:0 calc(var(--cell)*.07) 0 #3f9bd6}
.tile .sym{width:calc(var(--cell)*.84);height:calc(var(--cell)*.84);overflow:visible}
.tile .sym.decor{width:calc(var(--cell)*.58);height:calc(var(--cell)*.58);opacity:.95}
.tile .sym.bat{animation:floaty 2s ease-in-out infinite;width:calc(var(--cell)*.74);height:calc(var(--cell)*.74);transition:transform .4s,opacity .4s}
.tile .sym.bat.got{transform:translateY(-60%) scale(1.5);opacity:0}
.tile .sym.flag{width:calc(var(--cell)*.8);height:calc(var(--cell)*.8);animation:floaty 2.4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8%)}}
.pad{width:70%;height:70%;border-radius:50%;border:calc(var(--cell)*.05) dashed rgba(23,150,212,.6)}
.mk{width:68%;height:68%;border-radius:50%;background:var(--orange);color:var(--ink);display:grid;place-items:center;font:800 calc(var(--cell)*.4) var(--display);box-shadow:0 0 0 calc(var(--cell)*.06) rgba(255,138,31,.3);opacity:.45;transition:opacity .3s}
.mk.now{opacity:1;animation:beacon 1.4s ease-in-out infinite}
.mk.ok{background:var(--good);color:#fff;opacity:.9;box-shadow:none}
@keyframes beacon{50%{box-shadow:0 0 0 calc(var(--cell)*.16) rgba(255,138,31,.12)}}
.board.abs .tile.f1,.board.abs .tile.f2{background:#fff;box-shadow:inset 0 0 0 2px #d4e2ee}
.board.abs .tile.solid{background:#cfd9e6;box-shadow:none}
.board.abs .tile.water{background:#cfd9e6;box-shadow:none}
.board.abs .sym.decor,.board.abs .sym.tree,.board.abs .sym.rock,.board.abs .sym.wave{opacity:0}
.board.abs{background:linear-gradient(160deg,#e9eff6,#d6e0ec)}
.sym.decor{transition:opacity .35s}
.bot{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transform:translate(calc(var(--x)*var(--cell)),calc(var(--y)*var(--cell)));transition:transform var(--t,.36s) cubic-bezier(.4,.1,.25,1);z-index:3;pointer-events:none}
.bot .ring{position:absolute;inset:7%;border-radius:50%;border:calc(var(--cell)*.04) solid rgba(39,211,255,.65);background:radial-gradient(circle,rgba(39,211,255,.2),transparent 70%);transition:transform .26s}
.bot .ring::before{content:"";position:absolute;left:50%;top:calc(var(--cell)*-.06);transform:translateX(-50%);border:calc(var(--cell)*.09) solid transparent;border-bottom:calc(var(--cell)*.13) solid var(--orange);border-top:0}
.bot .spr{position:absolute;left:50%;bottom:15%;width:56%;transform:translateX(-50%);filter:drop-shadow(0 calc(var(--cell)*.05) 0 rgba(18,38,74,.2))}
.bot.hop .spr{animation:hop .34s ease-out}
.bot.shake .spr{animation:shake .4s}
@keyframes hop{40%{transform:translateX(-50%) translateY(-22%)}}
@keyframes shake{20%{transform:translateX(-80%)}40%{transform:translateX(-20%)}60%{transform:translateX(-70%)}80%{transform:translateX(-35%)}}
.status{min-height:50px;display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:18px;background:#fff;box-shadow:var(--shadow);font-weight:700;border-left:6px solid var(--blue)}
.status.ok{border-color:var(--good)} .status.bad{border-color:var(--bad)} .status.warn{border-color:var(--yel)}
.status .bt{margin-left:auto;display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.status .bt svg{width:22px;height:22px}
.btools{display:flex;gap:10px;flex-wrap:wrap}
.tgl[aria-pressed="true"]{background:var(--ink);color:#fff}

/* panel program */
.prog{padding:16px;display:flex;flex-direction:column;gap:14px}
.prog-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.prog-head h3{font-size:1.35rem;font-weight:800}
.count{font-weight:800;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:99px;background:#fff;box-shadow:0 2px 0 rgba(18,38,74,.1);font-size:.9rem}
.count.full{background:var(--yel)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.7);font-weight:800;font-size:.85rem;color:var(--ink2)}
.tab.now{background:var(--orange);color:var(--ink)}
.tab.ok{background:var(--good);color:#fff}
.lane{display:flex;flex-direction:column;gap:6px}
.lane-h{font-weight:800;font-size:.86rem;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.lane-h small{text-transform:none;letter-spacing:0;font-weight:700}

.slot .empty{color:var(--ink2);font-size:.88rem;font-weight:700;padding:6px 4px;align-self:center}
.blk{--b:#1288c8;--t:#fff;display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;border-radius:12px;background:var(--b);color:var(--t);font-weight:800;font-size:.92rem;box-shadow:0 3px 0 rgba(0,0,0,.18);cursor:default;transition:transform .15s,outline-color .15s;animation:pop .2s ease-out;outline:3px solid transparent}
.blk.L,.blk.R{--b:#ffbf3c;--t:var(--ink)}
.blk.REP{--b:#178f55}
.blk.P{--b:#d63060}
.blk.run{outline-color:var(--cyan);transform:scale(1.08)}
.blk .ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.blk .x{width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.18);color:inherit;font-weight:800;line-height:1;display:grid;place-items:center}
.blk.REP{flex:1 1 100%;display:flex;flex-direction:column;align-items:stretch;padding:8px;gap:8px}
.rep-h{display:flex;align-items:center;gap:8px}
.rep-h b{flex:1}
.stp{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.18);border-radius:10px;padding:2px}
.stp button{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:1.1rem;line-height:1}
.stp output{min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.blk.REP .slot{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6);min-height:52px;cursor:pointer}
.blk.REP .slot.on{background:#fff;border-color:var(--cyan)}
.blk.REP .slot .empty{color:#fff}
.blk.REP .slot.on .empty{color:var(--ink2)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.pal{--b:#1288c8;--t:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;padding:8px 6px;border-radius:16px;background:var(--b);color:var(--t);font-weight:800;font-size:.86rem;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s}
.pal:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.pal.L,.pal.R{--b:#ffbf3c;--t:var(--ink)}
.pal.REP{--b:#178f55}.pal.P{--b:#d63060}
.pal svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.runbar{display:flex;gap:8px;flex-wrap:wrap}
.runbar .btn.primary{flex:1 1 180px}
.tip{font-size:.84rem;color:var(--ink2);font-weight:700}
.star-goal{font-size:.84rem;color:var(--ink2);font-weight:700;display:flex;align-items:center;gap:6px}
.star-goal svg{width:16px;height:16px;color:var(--yel)}

/* kuis */
.qcard{padding:20px;display:flex;flex-direction:column;gap:16px}
.qprog{display:flex;gap:6px}
.qprog i{flex:1;height:8px;border-radius:9px;background:rgba(18,38,74,.14)}
.qprog i.d{background:var(--good)} .qprog i.c{background:var(--orange)}
.qprompt{font-size:clamp(1.2rem,3vw,1.55rem);font-weight:700;line-height:1.2}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px;border-radius:20px;background:rgba(255,255,255,.7)}
.tk{width:clamp(46px,11vw,64px);height:clamp(46px,11vw,64px);border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(18,38,74,.14);font:800 1.6rem var(--display)}
.tk svg{width:78%;height:78%}
.tk.a svg{fill:none;stroke:var(--ink);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;width:68%;height:68%}
.tk.q{background:var(--yel);border:3px dashed rgba(18,38,74,.35);box-shadow:none}
.tk.fill{animation:pop .3s}
.opts{display:grid;gap:10px}
.opts.pat{grid-template-columns:repeat(auto-fit,minmax(86px,1fr));justify-items:center}
.opt{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#fff;text-align:left;font-weight:700;box-shadow:0 3px 0 rgba(18,38,74,.14);border:2px solid transparent;min-height:54px;transition:transform .1s}
.opts.pat .opt{justify-content:center;padding:8px}
.opt:hover{border-color:var(--blue)}
.opt .cb{flex:none;width:26px;height:26px;border-radius:8px;border:3px solid var(--ink2);display:grid;place-items:center;color:#fff;font-size:.9rem}
.opt.on{border-color:var(--blue);background:#eaf8ff}
.opt.on .cb{background:var(--blue);border-color:var(--blue)}
.opt.bad{border-color:var(--bad);background:#ffeaf0;animation:shk .35s}
.opt.good{border-color:var(--good);background:#e6f9ee}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ord{display:grid;gap:8px}
.ord-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.7);min-height:52px;border:2px dashed rgba(18,38,74,.2)}
.ord-row .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 1rem var(--display)}
.ord-row.f{border-style:solid;border-color:rgba(18,38,74,.1);background:#fff}
.ord-row.f.bad{border-color:var(--bad);background:#ffeaf0;animation:shk .35s}
.ord-row.f.good{border-color:var(--good);background:#e6f9ee}
.ord-row button{flex:1;text-align:left;font-weight:700}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .step{padding:10px 14px;border-radius:14px;background:var(--orange);color:var(--ink);font-weight:800;box-shadow:0 3px 0 var(--orange2);text-align:left}
.qfb{min-height:28px;font-weight:700;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.7);display:none}
.qfb.show{display:block}
.qfb.ok{background:#e6f9ee;border-left:6px solid var(--good)}
.qfb.bad{background:#ffeaf0;border-left:6px solid var(--bad)}
.qbar{display:flex;justify-content:flex-end;gap:10px}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(18,38,74,.5);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;overflow:auto;animation:fade .2s}
.ov[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.sheet{width:min(560px,100%);background:#fff;border-radius:30px;padding:26px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px;animation:rise .28s cubic-bezier(.2,.9,.3,1.2);max-height:calc(100vh - 32px);overflow:auto}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
.sheet h2{font-size:2rem;font-weight:800}
.sheet .def{font-size:1.1rem}
.sheet .eg,.sheet .learn{padding:12px 14px;border-radius:16px;background:var(--sand);font-size:.98rem}
.sheet .learn{background:#eaf8ff}
.sheet ul{margin:0;padding-left:20px;display:grid;gap:6px}
.ihead{display:flex;align-items:center;gap:12px;color:var(--c)}
.ihead .wi{width:56px;height:56px;border-radius:18px;background:var(--c);color:#fff;display:grid;place-items:center}
.ihead .wi svg{width:36px;height:36px}
.ihead span{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.result{text-align:center;align-items:center}
.rstars{display:flex;gap:8px;justify-content:center}
.rs{width:64px;height:64px;color:#d4dce6;transform:scale(.6)}
.rs.on{color:var(--yel);animation:starIn .5s cubic-bezier(.2,1.6,.4,1) forwards;animation-delay:var(--d);filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.cert{text-align:center;align-items:center;background:linear-gradient(#fff,#fff8e6);border:6px double var(--orange)}
.cert .nm{font:800 clamp(2rem,8vw,3rem) var(--display);color:var(--orange2);line-height:1}
.cert .hb{width:120px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);z-index:60;max-width:min(520px,calc(100vw - 32px));padding:12px 18px;border-radius:18px;background:var(--ink);color:#fff;font-weight:700;opacity:0;pointer-events:none;transition:.28s;box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}

@media (max-width:900px){
  .home{grid-template-columns:1fr;text-align:center;min-height:0}
  .brand{align-items:center}

  .cta{justify-content:center}
  .stage-hero{order:-1;max-width:340px}
  .lv-body{grid-template-columns:minmax(0,1fr)}
  .worlds{grid-template-columns:minmax(0,1fr)}
}

  .pillars{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sheet{padding:20px;border-radius:24px}
  .btn{padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const SOLID='#Tw';
const MAXSTEPS=400;
function parseMap(rows){
  const H=rows.length,W=rows[0].length,t=[],marks={},bats=[];let start=null;
  for(let y=0;y<H;y++){t.push([]);for(let x=0;x<W;x++){const c=rows[y][x];
    if(c==='S')start={x,y};
    if('ABCG'.includes(c))marks[c]={x,y};
    if(c==='b')bats.push({x,y});
    t[y].push(c);}}
  return {W,H,t,start,marks,bats};
}
function solid(m,x,y){return x<0||y<0||x>=m.W||y>=m.H||SOLID.includes(m.t[y][x]);}
function flatten(main,proc){
  const out=[];let tooLong=false;
  function walk(list,inProc){
    for(const b of list){
      if(tooLong)return;
      if(b.t==='REP'){for(let i=0;i<b.n;i++){walk(b.body,inProc);if(tooLong)return;}}
      else if(b.t==='P'){if(!inProc)walk(proc,true);}
      else out.push({op:b.t,id:b.id});
      if(out.length>MAXSTEPS){tooLong=true;return;}
    }
  }
  walk(main,false);
  return {steps:out,tooLong};
}
function countBlocks(list){let n=0;for(const b of list){n++;if(b.t==='REP')n+=countBlocks(b.body);}return n;}
function simulate(m,st,steps,target,needAll,got){
  let x=st.x,y=st.y,d=st.d;const ev=[],col=new Set(got);
  const done=()=>x===target.x&&y===target.y&&(!needAll||m.bats.every(b=>col.has(b.x+','+b.y)));
  for(const s of steps){
    if(s.op==='L'){d=(d+3)%4;ev.push({k:'turn',dd:-1,d,id:s.id});}
    else if(s.op==='R'){d=(d+1)%4;ev.push({k:'turn',dd:1,d,id:s.id});}
    else{
      const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
      if(solid(m,nx,ny)){ev.push({k:'bump',x,y,d,nx,ny,id:s.id});return {ev,res:'bump',x,y,d,col};}
      x=nx;y=ny;const key=x+','+y;let gb=null;
      if(m.bats.some(b=>b.x===x&&b.y===y)&&!col.has(key)){col.add(key);gb=key;}
      ev.push({k:'move',x,y,d,id:s.id,bat:gb});
    }
    if(done())return {ev,res:'win',x,y,d,col};
  }
  return {ev,res:(x===target.x&&y===target.y)?'bats':'short',x,y,d,col};
}

  if(!S.sound||!ac)return;
  try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;

}

/* ---------- level ---------- */
function openLevel(id){
  const lv=LEVELS.find(l=>l.id===id),w=WORLDS[lv.w-1];
  L={lv,w,token:0,running:false,fails:0,speed:1,abs:false,uid:1,mist:0,qi:0,rot:0,seg:0};
  $('#lvChip').textContent=w.name;$('#lvChip').style.setProperty('--c',w.color);
  $('#lvTitle').textContent=lv.id+'  '+lv.title;
  say(lv.story,'');
  go('level');
  if(lv.kind==='run')initRun();else initQuiz();
  if(!S.intro[lv.w])showIntro(lv.w);
}
function leaveLevel(){if(L)L.token++;L=null;go('map');}

/* ---------- mode koding ---------- */
function initRun(){
  const lv=L.lv;
  L.map=parseMap(lv.map);
  L.segs=lv.seg?['A','B','C','G'].filter(k=>L.map.marks[k]):['G'];
  L.lists={m:L.segs.map(()=>[]),proc:[]};
  L.active=L.lists.m[0];
  L.bot={x:L.map.start.x,y:L.map.start.y,d:lv.dir};L.rot=lv.dir*90;
  L.segStart={x:L.bot.x,y:L.bot.y,d:lv.dir,rot:L.rot};
  L.got=new Set();L.gotStart=new Set();
  const pg=S.prog&&S.prog[lv.id];
  if(pg&&lv.seg&&pg.seg>0&&pg.seg<L.segs.length){
    L.seg=pg.seg;pg.lists.forEach((l,i)=>{L.lists.m[i]=l;});L.active=L.lists.m[L.seg];
    L.segStart=pg.segStart;L.rot=pg.segStart.rot;L.bot={x:pg.segStart.x,y:pg.segStart.y,d:pg.segStart.d};
    L.gotStart=new Set(pg.gotStart);L.got=new Set(L.gotStart);
    let mx=0;allLists().forEach(l=>eachBlock(l,b=>{if(b.id>mx)mx=b.id;}));L.uid=mx+1;
  }
  $('#lvBody').classList.remove('single');
  buildStage();buildPanel();fit();placeBot(false);
  setStatus(lv.seg?(L.seg?`Selamat datang kembali! Lanjut ke Misi ${L.seg+1}.`:'Misi 1: antar Robo ke titik A.'):'Susun program lalu tekan Jalankan.','');
}
function buildStage(){
  const m=L.map;
  const tiles=[];
  for(let y=0;y<m.H;y++)for(let x=0;x<m.W;x++){
    const c=m.t[y][x];let cls='tile',inner='';
    if(c==='#'||c==='T'){cls+=' solid';const n=c==='T'?'tree':'rock';inner=`<svg class="sym ${n}"><use href="#i-${n}"/></svg>`;}
    else if(c==='w'){cls+=' water';inner='<svg class="sym wave"><use href="#i-wave"/></svg>';}
    else{
      cls+=(x+y)%2?' f2':' f1';
      if(c==='f')inner='<svg class="sym decor"><use href="#i-flower"/></svg>';
      else if(c==='m')inner='<svg class="sym decor"><use href="#i-mush"/></svg>';
      else if(c==='b')inner=`<svg class="sym bat" id="bat-${x}-${y}"><use href="#i-bat"/></svg>`;
      else if(c==='S')inner='<span class="pad"></span>';
      else if(c==='G')inner='<svg class="sym flag"><use href="#i-flag"/></svg>';
      else if('ABC'.includes(c))inner=`<span class="mk" data-k="${c}">${c}</span>`;
    }
    tiles.push(`<div class="${cls}" style="grid-column:${x+1};grid-row:${y+1}">${inner}</div>`);
  }
  const hasBat=m.bats.length>0;
  $('#stage').innerHTML=`
    <div class="boardWrap" id="boardWrap"><div class="board" id="board" style="--cols:${m.W};--rows:${m.H}">
      <div class="grid">${tiles.join('')}
        <div class="bot" id="bot" style="--x:0;--y:0"><div class="ring" id="ring"></div><div class="spr" id="spr"></div></div>
      </div></div></div>
    <div class="status" id="status"><span id="stTxt"></span>${hasBat?`<span class="bt" id="batCt"><svg><use href="#i-bat"/></svg><b id="batN">0</b>/${m.bats.length}</span>`:''}</div>
    <div class="btools">
      ${L.lv.clutter?'<button class="btn sm tgl" id="absBtn" aria-pressed="false">Mode Abstrak: Mati</button>':''}
      <button class="btn sm tgl" id="spdBtn" aria-pressed="false">Kecepatan 1x</button>
    </div>`;
  $('#spr').innerHTML=robotSVG('');
  updateMarks();
}
function fit(){
  if(!L||L.lv.kind!=='run')return;
  const wrap=$('#boardWrap');if(!wrap)return;
  const m=L.map,aw=wrap.clientWidth-26,wide=matchMedia('(min-width:901px)').matches;
  const maxH=wide?Math.max(280,innerHeight-330):Math.max(210,innerHeight*.4);
  const cell=Math.max(28,Math.min(88,Math.floor(aw/m.W),Math.floor(maxH/m.H)));
  $('#board').style.setProperty('--cell',cell+'px');
}
function placeBot(anim){
  const b=$('#bot');if(!b)return;
  b.style.setProperty('--t',anim?(.36/L.speed)+'s':'0s');
  b.style.setProperty('--x',L.bot.x);b.style.setProperty('--y',L.bot.y);
  $('#ring').style.transform=`rotate(${L.rot}deg)`;
  const e=[[0,-6],[7,0],[0,5],[-7,0]][L.bot.d];
  $('#spr').firstElementChild.style.setProperty('--ex',e[0]+'px');
  $('#spr').firstElementChild.style.setProperty('--ey',e[1]+'px');
}
function mood(m){const r=$('#spr .robo');if(r)r.setAttribute('class','robo '+m);}
function setStatus(t,cls){const s=$('#status');if(!s)return;s.className='status '+(cls||'');$('#stTxt').textContent=t;}
function updateMarks(){
  $$('.mk').forEach(el=>{
    const k=el.dataset.k,i=L.segs.indexOf(k);
    el.classList.toggle('ok',i>=0&&i<L.seg);
    el.classList.toggle('now',i===L.seg);
    if(i>=0&&i<L.seg)el.textContent='✓';
  });
}

/* panel program */
function eachBlock(list,cb){for(const b of list){cb(b,list);if(b.t==='REP')eachBlock(b.body,cb);}}
function allLists(){return [...L.lists.m,L.lists.proc];}
function findBlock(id){let r=null;for(const l of allLists())eachBlock(l,(b,p)=>{if(b.id===id)r={b,p};});return r;}
function findList(key){
  if(key==='m')return L.lists.m[L.seg];
  if(key==='proc')return L.lists.proc;
  const f=findBlock(+key);return f?f.b.body:null;
}
function inProc(list){
  if(list===L.lists.proc)return true;
  let r=false;eachBlock(L.lists.proc,b=>{if(b.t==='REP'&&b.body===list)r=true;});return r;
}
function totalBlocks(){return allLists().reduce((n,l)=>n+countBlocks(l),0);}
function buildPanel(){
  const lv=L.lv,tools=lv.tools;
  $('#panel').innerHTML=`<div class="prog glass">
    <div class="prog-head"><h3>Program Robo</h3><span class="count" id="count"></span></div>
    ${lv.seg?'<div class="tabs" id="tabs"></div>':''}
    <div id="lanes"></div>
    <div class="star-goal"><svg><use href="#i-star"/></svg>Bintang penuh jika memakai ${lv.par} blok atau kurang</div>
    <div class="palette" id="palette">${tools.map(t=>`<button class="pal ${t}" data-add="${t}" aria-label="Tambah ${LABEL[t]}">${ICON[t]}<span>${LABEL[t]}</span></button>`).join('')}</div>
    <p class="tip">Blok baru masuk ke kotak yang bergaris biru. Ketuk kotak lain untuk berpindah.</p>
    <div class="runbar">
      <button class="btn primary big" id="runBtn">Jalankan</button>
      <button class="btn" id="resetBtn">Ulang</button>
      <button class="btn" id="clearBtn">Hapus Semua</button>
    </div></div>`;
  renderLanes();
}
function blockHTML(b){
  if(b.t==='REP')return `<div class="blk REP" data-id="${b.id}">
    <div class="rep-h"><span class="ico">${ICON.REP}</span><b>Ulangi</b>
      <span class="stp"><button data-act="dec" data-id="${b.id}" aria-label="Kurangi">&minus;</button><output>${b.n}x</output><button data-act="inc" data-id="${b.id}" aria-label="Tambah">+</button></span>
      <button class="x" data-act="del" data-id="${b.id}" aria-label="Hapus">&times;</button></div>
    <div class="slot${L.active===b.body?' on':''}" data-list="${b.id}">${listHTML(b.body)}</div></div>`;
  return `<div class="blk ${b.t}" data-id="${b.id}"><span class="ico">${ICON[b.t]}</span><b>${LABEL[b.t]}</b><button class="x" data-act="del" data-id="${b.id}" aria-label="Hapus">&times;</button></div>`;
}
function listHTML(l){return l.length?l.map(blockHTML).join(''):'<span class="empty">Kosong. Ketuk blok di bawah.</span>';}
function renderLanes(){
  const lv=L.lv,name=k=>k==='G'?'bendera':'titik '+k;
  const main=L.lists.m[L.seg];
  const title=lv.seg?`Misi ${L.seg+1}: ${L.seg===0?'Start':'titik '+L.segs[L.seg-1]} ke ${name(L.segs[L.seg])}`:'Program Utama';
  let h=`<div class="lane"><div class="lane-h">${title}</div><div class="slot${L.active===main?' on':''}" data-list="m">${listHTML(main)}</div></div>`;
  if(lv.tools.includes('P'))h+=`<div class="lane" style="margin-top:10px"><div class="lane-h">Fungsi <small>(kumpulan langkah yang bisa dipanggil)</small></div><div class="slot${L.active===L.lists.proc?' on':''}" data-list="proc">${listHTML(L.lists.proc)}</div></div>`;
  $('#lanes').innerHTML=h;
  const tot=totalBlocks(),c=$('#count');
  c.textContent=`${tot} / ${lv.max} blok`;c.classList.toggle('full',tot>=lv.max);
  if(lv.seg)$('#tabs').innerHTML=L.segs.map((k,i)=>`<span class="tab ${i<L.seg?'ok':i===L.seg?'now':''}">${i<L.seg?'✓ ':''}Misi ${i+1}</span>`).join('');
}
function addBlock(t){
  if(!L||L.running)return;
  if(t==='P'&&inProc(L.active)){toast('Fungsi tidak boleh memanggil dirinya sendiri.');sfx.bad();return;}
  if(totalBlocks()>=L.lv.max){toast('Batas blok tercapai. Coba pakai Ulangi atau Fungsi supaya lebih singkat.');sfx.bad();return;}
  const b=t==='REP'?{id:L.uid++,t,n:2,body:[]}:{id:L.uid++,t};
  L.active.push(b);
  if(t==='REP')L.active=b.body;
  sfx.click();renderLanes();
}
function delBlock(id){
  if(L.running)return;
  const f=findBlock(id);if(!f)return;
  f.p.splice(f.p.indexOf(f.b),1);
  if(!allLists().includes(L.active)){let ok=false;for(const l of allLists()){if(l===L.active)ok=true;eachBlock(l,b=>{if(b.t==='REP'&&b.body===L.active)ok=true;});}
    if(!ok)L.active=inProc(L.active)?L.lists.proc:L.lists.m[L.seg];}
  sfx.click();renderLanes();
}
function stepRep(id,d){
  if(L.running)return;const f=findBlock(id);if(!f)return;
  f.b.n=Math.max(2,Math.min(12,f.b.n+d));sfx.click();renderLanes();
}
function clearProg(){
  if(L.running)return;
  L.lists.m[L.seg].length=0;L.lists.proc.length=0;L.active=L.lists.m[L.seg];renderLanes();
}
function highlight(id){
  $$('.blk.run').forEach(e=>e.classList.remove('run'));
  if(id==null)return;
  const e=$(`.blk[data-id="${id}"]`);if(e)e.classList.add('run');
}
function resetBoard(anim){
  L.bot={x:L.segStart.x,y:L.segStart.y,d:L.segStart.d};L.rot=L.segStart.rot;
  L.got=new Set(L.gotStart);
  $$('.sym.bat').forEach(e=>e.classList.remove('got'));
  L.got.forEach(k=>{const [x,y]=k.split(',');const e=$(`#bat-${x}-${y}`);if(e)e.classList.add('got');});
  setBat();placeBot(anim);mood('');
}
function setBat(){const n=$('#batN');if(n)n.textContent=L.got.size;}
async function wait(ms){await sleep(reduce?20:ms/L.speed);}

async function runProgram(){
  if(!L||L.running)return;
  unlockAudio();
  const main=L.lists.m[L.seg];
  if(!main.length){setStatus('Susun blokmu dulu ya.','warn');sfx.bad();return;}
  const fl=flatten(main,L.lists.proc);
  if(fl.tooLong){setStatus('Programmu terlalu panjang. Periksa blok Ulangi.','warn');return;}
  resetBoard(false);
  L.running=true;const tok=++L.token;
  $('#runBtn').disabled=true;
  setStatus('Robo sedang menjalankan programmu...','');
  const target=L.map.marks[L.segs[L.seg]],last=L.seg===L.segs.length-1;
  const sim=simulate(L.map,L.segStart,fl.steps,target,!L.lv.seg,L.gotStart);
  await sleep(200);
  for(const e of sim.ev){
    if(tok!==L.token)return;
    highlight(e.id);
    const b=$('#bot');
    if(e.k==='turn'){
      L.rot+=e.dd*90;L.bot.d=e.d;placeBot(true);sfx.turn();await wait(280);
    }else if(e.k==='move'){
      L.bot.x=e.x;L.bot.y=e.y;placeBot(true);
      b.classList.remove('hop');void b.offsetWidth;b.classList.add('hop');sfx.step();
      await wait(380);
      if(e.bat){L.got.add(e.bat);const [x,y]=e.bat.split(',');const be=$(`#bat-${x}-${y}`);if(be)be.classList.add('got');setBat();sfx.coll();}
    }else{
      mood('sad');b.classList.add('shake');sfx.bad();
      b.style.setProperty('--t',(.14/L.speed)+'s');
      b.style.setProperty('--x',e.x+(e.nx-e.x)*.35);b.style.setProperty('--y',e.y+(e.ny-e.y)*.35);
      await wait(160);
      b.style.setProperty('--x',e.x);b.style.setProperty('--y',e.y);
      await wait(420);b.classList.remove('shake');
    }
  }
  if(tok!==L.token)return;
  highlight(null);
  L.running=false;$('#runBtn').disabled=false;
  const bad=async msg=>{
    L.fails++;mood('sad');setStatus(msg,'bad');say(msg,'sad');await sleep(reduce?50:900);
    if(tok!==L.token)return;resetBoard(true);
    if(L.fails===3)toast('Buntu? Tekan tombol Petunjuk di atas.');
  };
  if(sim.res==='win'){
    mood('happy');sfx.ok();
    if(!last){
      L.segStart={x:sim.x,y:sim.y,d:sim.d,rot:L.rot};L.gotStart=new Set(sim.col);
      const done=L.seg+1;L.seg++;L.active=L.lists.m[L.seg];updateMarks();
      setStatus(`Misi ${done} selesai! Lanjut ke Misi ${done+1}.`,'ok');say(`Hebat! Misi ${done} selesai. Sekarang Misi ${done+1}.`,'happy');
      S.prog=S.prog||{};S.prog[L.lv.id]={seg:L.seg,segStart:L.segStart,gotStart:[...L.gotStart],lists:L.lists.m.slice(0,L.seg).map(l=>JSON.parse(JSON.stringify(l)))};save();
      renderLanes();
    }else{
      updateMarks();finishRun();
    }
  }else if(sim.res==='bump')await bad('Aduh, Robo menabrak penghalang. Periksa lagi langkah dan arah belokmu.');
  else if(sim.res==='bats')await bad('Robo sudah di bendera, tetapi masih ada baterai yang belum diambil.');
  else await bad('Robo belum sampai di tujuan. Tambah atau perbaiki langkahmu.');
}
function finishRun(){
  const n=totalBlocks(),par=L.lv.par,st=n<=par?3:n<=par+2?2:1;
  setStatus('Berhasil! Robo sampai di tujuan.','ok');say('Yeay, misi berhasil!','happy');
  sfx.win();confetti();
  S.stars[L.lv.id]=Math.max(S.stars[L.lv.id]||0,st);if(S.prog)delete S.prog[L.lv.id];save();
  setTimeout(()=>showResult(st,`Kamu memakai <b>${n} blok</b>. ${st===3?'Efisien sekali.':`Untuk bintang penuh, coba capai ${par} blok atau kurang.`}`),reduce?50:1100);
}
function resetRun(){
  if(!L||L.lv.kind!=='run')return;
  L.token++;L.running=false;highlight(null);
  const r=$('#runBtn');if(r)r.disabled=false;
  resetBoard(true);setStatus('Robo kembali ke posisi awal misi ini.','');
}

/* ---------- kuis ---------- */
function initQuiz(){
  $('#lvBody').classList.add('single');$('#panel').innerHTML='';
  L.qi=0;L.mist=0;renderQ();
}
function shuffle(a){const r=a.map((_,i)=>i);let s=0;do{for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}s++;}while(s<20&&r.every((v,i)=>v===i));return r;}
function renderQ(){
  const lv=L.lv,q=lv.qs[L.qi];L.done=false;L.sel=new Set();
  const dots=lv.qs.map((_,i)=>`<i class="${i<L.qi?'d':i===L.qi?'c':''}"></i>`).join('');
  let body='';
  if(q.k==='pattern'){
    body=`<div class="seq">${q.seq.map(tok).join('')}<span class="tk q" id="slot">?</span></div>
      <div class="opts pat">${q.opts.map((o,i)=>`<button class="opt" data-pick="${i}" aria-label="Pilihan ${i+1}">${tok(o)}</button>`).join('')}</div>`;
  }else if(q.k==='multi'){
    body=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-tog="${i}"><span class="cb"></span><span>${o[0]}</span></button>`).join('')}</div>`;
  }else{
    L.ord={pool:shuffle(q.steps),ans:[]};
    body=`<div class="ord" id="ord"></div><div class="pool" id="pool"></div>`;
  }
  $('#stage').innerHTML=`<div class="qcard glass"><div class="qprog">${dots}</div>
    <h3 class="qprompt">${q.prompt}</h3>${body}
    <div class="qfb" id="qfb" role="status"></div>
    <div class="qbar">${q.k==='pattern'?'':'<button class="btn" id="qCheck">Periksa</button>'}<button class="btn primary" id="qNext" hidden>${L.qi===lv.qs.length-1?'Selesai':'Lanjut'}</button></div></div>`;
  if(q.k==='order')renderOrd();
  say(L.qi===0?lv.story:'Bagus! Soal berikutnya.','');
}
function renderOrd(){
  const q=L.lv.qs[L.qi],o=L.ord;
  const rows=q.steps.map((_,pos)=>{
    const v=o.ans[pos];
    return v===undefined?`<div class="ord-row"><span class="n">${pos+1}</span><span style="color:var(--ink2)">Pilih langkah ke-${pos+1}</span></div>`
      :`<div class="ord-row f" data-pos="${pos}"><span class="n">${pos+1}</span><button data-unpick="${pos}">${q.steps[v]}</button></div>`;
  });
  $('#ord').innerHTML=rows.join('');
  $('#pool').innerHTML=o.pool.map(i=>`<button class="step" data-order="${i}">${q.steps[i]}</button>`).join('');
}
function fb(ok,t){const f=$('#qfb');f.className='qfb show '+(ok?'ok':'bad');f.textContent=t;}
function qCorrect(){
  const q=L.lv.qs[L.qi];L.done=true;sfx.ok();say('Tepat sekali!','happy');
  fb(true,q.why);
  const c=$('#qCheck');if(c)c.hidden=true;$('#qNext').hidden=false;$('#qNext').focus();
}
function qWrong(msg){L.mist++;sfx.bad();say('Hampir! Coba lagi.','sad');fb(false,msg);}
function stageClick(e){
  if(!L||L.lv.kind!=='quiz'||L.done)return;
  const q=L.lv.qs[L.qi],t=e.target;
  const pick=t.closest('[data-pick]');
  if(pick){
    const i=+pick.dataset.pick;unlockAudio();
    if(i===q.ans){pick.classList.add('good');const s=$('#slot');s.className='tk fill';s.innerHTML=tok(q.opts[i]).replace(/^<span class="tk[^"]*">|<\/span>$/g,'');qCorrect();}
    else{pick.classList.remove('bad');void pick.offsetWidth;pick.classList.add('bad');qWrong('Belum tepat. Lihat lagi apa yang berulang pada deretan itu.');}
    return;
  }
  const tg=t.closest('[data-tog]');
  if(tg){unlockAudio();const i=+tg.dataset.tog;tg.classList.toggle('on');tg.classList.remove('bad');L.sel.has(i)?L.sel.delete(i):L.sel.add(i);sfx.click();return;}
  const od=t.closest('[data-order]');
  if(od){unlockAudio();const i=+od.dataset.order;L.ord.pool=L.ord.pool.filter(v=>v!==i);L.ord.ans.push(i);sfx.click();renderOrd();return;}
  const un=t.closest('[data-unpick]');
  if(un){const pos=+un.dataset.unpick;const [v]=L.ord.ans.splice(pos,1);L.ord.pool.push(v);sfx.click();renderOrd();$('#qfb').className='qfb';}
}
function quizCheck(){
  const q=L.lv.qs[L.qi];unlockAudio();
  if(q.k==='multi'){
    const need=q.opts.map((o,i)=>o[1]?i:-1).filter(i=>i>=0);
    const wrongSel=[...L.sel].filter(i=>!q.opts[i][1]);
    if(!L.sel.size){fb(false,'Pilih dulu jawabanmu.');return;}
    if(wrongSel.length===0&&L.sel.size===need.length){$$('.opt').forEach((b,i)=>{if(q.opts[i][1])b.classList.add('good');});qCorrect();}
    else{
      $$('.opt').forEach((b,i)=>{if(wrongSel.includes(i)){b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');}});
      qWrong(wrongSel.length?'Ada pilihan yang kurang tepat. Ingat, pilih hanya yang sesuai dengan misinya.':`Masih ada yang terlewat. Jawaban yang benar ada ${need.length}.`);
    }
  }else{
    if(L.ord.pool.length){fb(false,'Letakkan semua langkah dulu.');return;}
    const rows=$$('.ord-row.f');let ok=true;
    L.ord.ans.forEach((v,pos)=>{const good=v===pos;if(!good)ok=false;rows[pos].classList.remove('good','bad');void rows[pos].offsetWidth;rows[pos].classList.add(good?'good':'bad');});
    if(ok)qCorrect();else qWrong('Ada langkah yang urutannya salah (yang merah). Ketuk untuk melepas dan susun ulang.');
  }
}
function quizNext(){
  if(L.qi<L.lv.qs.length-1){L.qi++;renderQ();return;}
  const st=L.mist===0?3:L.mist<=2?2:1;
  S.stars[L.lv.id]=Math.max(S.stars[L.lv.id]||0,st);save();
  sfx.win();confetti();
  showResult(st,L.mist===0?'Semua jawaban benar pada percobaan pertama.':`Kamu salah ${L.mist} kali sebelum benar. Terus berlatih!`);
}
function showResult(st,detail){
  const idx=LEVELS.indexOf(L.lv),next=LEVELS[idx+1],w=L.w;
  modal(`<div class="sheet result" role="dialog" aria-modal="true">
    <div class="rstars">${[1,2,3].map(i=>`<svg class="rs ${i<=st?'on':''}" style="--d:${i*.22}s"><use href="#i-star"/></svg>`).join('')}</div>
    <h2>${st===3?'Luar biasa!':'Level selesai!'}</h2><p class="def">${detail}</p>
    <div class="learn"><b>${w.name}:</b> ${L.lv.learn||w.learn}</div>
    <div class="btnrow"><button class="btn" data-act="again">Ulangi</button><button class="btn" data-act="map">Peta</button>
    ${next?'<button class="btn primary" data-act="next">Lanjut</button>':'<button class="btn primary" data-act="cert">Lihat Sertifikat</button>'}</div></div>`);
}

/* ---------- event ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const a=t.closest('[data-act]');
  if(a){
    const act=a.dataset.act;
    if(act==='close')closeModal();
    else if(act==='again'){const id=L.lv.id;closeModal();openLevel(id);}
    else if(act==='map'){closeModal();leaveLevel();}
    else if(act==='next'){const n=LEVELS[LEVELS.indexOf(L.lv)+1];closeModal();openLevel(n.id);}
    else if(act==='cert'){closeModal();showCert();}
    else if(act==='del')delBlock(+a.dataset.id);
    else if(act==='inc')stepRep(+a.dataset.id,1);
    else if(act==='dec')stepRep(+a.dataset.id,-1);
    return;
  }
  if(t===$('#ov')){closeModal();return;}
  const add=t.closest('[data-add]');if(add){addBlock(add.dataset.add);return;}
  const slot=t.closest('.slot');
  if(slot&&L&&L.lv.kind==='run'&&!L.running){const l=findList(slot.dataset.list);if(l){L.active=l;renderLanes();}return;}
  const gg=t.closest('[data-go]');if(gg){go(gg.dataset.go);return;}
  const node=t.closest('[data-lv]');if(node&&!node.disabled){unlockAudio();sfx.click();openLevel(node.dataset.lv);return;}
  const info=t.closest('[data-intro]');if(info){showIntro(+info.dataset.intro);return;}
  if(t.closest('#stage'))stageClick(e);
  if(t.closest('#qCheck'))quizCheck();
  if(t.closest('#qNext'))quizNext();
  if(t.closest('#runBtn'))runProgram();
  if(t.closest('#resetBtn'))resetRun();
  if(t.closest('#clearBtn'))clearProg();
  const ab=t.closest('#absBtn');
  if(ab){L.abs=!L.abs;$('#board').classList.toggle('abs',L.abs);ab.setAttribute('aria-pressed',L.abs);ab.textContent='Mode Abstrak: '+(L.abs?'Hidup':'Mati');
    if(L.abs)setStatus('Hanya hal penting yang terlihat: jalan, penghalang, dan tujuan.','ok');sfx.click();}
  const sp=t.closest('#spdBtn');
  if(sp){L.speed=L.speed===1?2:1;sp.textContent='Kecepatan '+L.speed+'x';sp.setAttribute('aria-pressed',L.speed===2);}
});
$('#play').onclick=()=>{unlockAudio();sfx.click();go('map');};
$('#how').onclick=showHow;
$('#mapHome').onclick=()=>go('home');
$('#certBtn').onclick=showCert;
$('#back').onclick=leaveLevel;
$('#hintBtn').onclick=()=>{if(!L)return;toast(L.lv.hint||'Baca misi dengan teliti, lalu pecah jadi langkah kecil.',6500);};
$('#nameIn').addEventListener('input',e=>{S.name=e.target.value;save();});
function snd(){const b=$('#sndBtn');b.textContent='Suara: '+(S.sound?'Hidup':'Mati');b.setAttribute('aria-pressed',S.sound);}
$('#sndBtn').onclick=()=>{S.sound=!S.sound;save();snd();if(S.sound){unlockAudio();sfx.click();}};
addEventListener('resize',fit);
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#ov').hidden){closeModal();return;}
  if(!L||L.lv.kind!=='run'||!$('#ov').hidden||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const m={ArrowUp:'F',ArrowLeft:'L',ArrowRight:'R'}[e.key];
  if(m){e.preventDefault();addBlock(m);}
  else if(e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();runProgram();}
  else if(e.key==='Backspace'){e.preventDefault();const l=L.active;if(l.length)delBlock(l[l.length-1].id);}
});

load();snd();renderHome();go('home');
})();
</script>

</body></html>
